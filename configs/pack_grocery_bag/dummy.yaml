# Pack Grocery Bag -- dummy mode (no robot).
#
# Four coloured cubes and a paper grocery bag; the agent must choose which
# single cube goes into the bag FIRST. Ground truth
# (see gt-mass.json / gt-stiffness.json) is built so neither mass nor
# stiffness alone answers it -- green is heavy AND rigid, yellow is heaviest
# but deformable, blue is rigid but light. Only both together identify green.
#
# The prompt deliberately does NOT mention mass, stiffness, measurement, or
# efficiency -- deriving the packing rule is what this task benchmarks.
#
# Visual setting: as in the paper. CaP-X setting S2
# (high-level API).
#   use_visual_feedback: true -- the CaP and CaP+PhysX coding agents also see the
#     camera image after each turn. The other methods ignore this flag.
#   use_img_differencing: true -- from the second turn on, the Visual
#     Differencing Module (CaP-X setting M3) describes in text what changed
#     in the scene, and the coding agent gets that text. All methods.
# The Planner and Prioritizer always see the scene image.
#
# Run:
#   uv run python -m physcap.run --config-path configs/pack_grocery_bag/dummy.yaml --method physcap

env:
  _target_: physcap.envs.piper_env.PiperEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: physcap.envs.piper_dummy.PiperDummyLowLevel
      scenes_path: configs/pack_grocery_bag/scenes.json
      scenario: bag_right
      # Env-overridable so a run can use its own alias table. The file is only
      # read; set PHYSCAP_ALIAS_CACHE to save what the LLM name resolver learns.
      aliases_path: ${oc.env:PHYSCAP_ALIASES_PATH,configs/pack_grocery_bag/aliases.json}
      gt_mass_path: configs/pack_grocery_bag/gt-mass.json
      gt_stiffness_path: configs/pack_grocery_bag/gt-stiffness.json
      # auto: no prompts at all -- mass and stiffness come from the GT files
      # and the scene advances on its own. Set to false for manual entry.
      auto: true
      # Grades the agent's declared line. Used only for scoring: never shown
      # to the agent and never steers the trial.
      #
      # Nothing derives this from the GT tables, so an arm that changes which
      # cube should win must move this in lockstep or every trial scores
      # wrong. Env-overridable for that reason.
      target_key: ${oc.env:PHYSCAP_TARGET_KEY,green}
      decision_label: "FIRST ITEM"
      # Inert here: this scenario's `final` is outcome-keyed, so the frame
      # follows the declared choice rather than a mass threshold.
      empty_mass_threshold: 0.0
    privileged: true
    apis:
      - DummyPhysXApi

task_name: pack_grocery_bag
# Every prompt for this task (task text, coding-agent rules, short summary) is in this folder.
prompt_dir: prompts/tasks/pack_grocery_bag

server_url: http://127.0.0.1:8110/chat/completions
model: google/gemini-3.1-pro-preview

# Visual setting: see the comment at the top of this file.
use_visual_feedback: true
use_img_differencing: true

use_parallel_ensemble: false
use_multimodel: false
temperature: 0.2

output_dir: outputs/pack_grocery_bag
trials: 1
num_workers: 1

# Cost guard: hard cap on multi-turn iterations per trial. Nothing blocks on
# human input in auto mode, so an agent that never says FINISH would otherwise
# keep querying the model. 4 cubes x up to 2 properties + a decision turn.
max_turns: 10
